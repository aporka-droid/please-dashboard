<style>
  /* Theme variables: the defaults are the QR Please look, JS swaps them per project */
  :root{
    --bg:#2f4a39; --ring1:#3a553d; --ring2:#44604a;
    --ink:#0f2c1f; --pill:#f0ecda; --logo:#f0ecda; --label:#f0ecda;
    --counter:rgba(240,236,218,.72); --bigno:rgba(240,236,218,.085);
    --btn:#0f2c1f; --btnt:#f0ecda; --sub:#57725f; --ghic:#0f2c1f;
    --devborder:#7d9c5e; --devshadow:rgba(10,25,15,.28); --cardshadow:rgba(0,0,0,0);
    --ease:cubic-bezier(.22,.9,.24,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);transition:background-color .7s ease}
  body{font-family:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--pill);-webkit-font-smoothing:antialiased;user-select:none}
  button{font-family:inherit}
  *{-webkit-tap-highlight-color:transparent}
  body{touch-action:manipulation}

  /* the stage is clipped inside a fixed box so it can never widen the page on phones */
  #vp{position:fixed;left:0;top:0;right:0;bottom:0;overflow:hidden;contain:strict;visibility:hidden}
  #vp.ready{visibility:visible}
  html.boot *{transition:none!important;animation:none!important}

  /* Fixed design canvas (2419 x 1512), scaled to fit the window */
  #stage{position:absolute;left:0;top:0;width:2419px;height:1512px;transform-origin:0 0}
  .abs{position:absolute}

  /* ---------- background rings ---------- */
  .ring-big{left:480px;top:140px;width:1480px;height:1240px;border-radius:50%;background:var(--ring1);transition:background-color .7s ease}
  .ring-small{left:845px;top:335px;width:790px;height:775px;border-radius:50%;background:var(--ring2);transition:background-color .7s ease}

  /* ---------- top bar ---------- */
  .logo{left:113px;top:66px;font-size:60px;font-weight:600;letter-spacing:-.035em;line-height:1;color:var(--logo);transition:color .6s ease}

  .pill{position:absolute;top:55px;height:87px;border-radius:44px;background:var(--pill);color:var(--ink);transition:background-color .6s ease,color .6s ease}

  .selector{position:absolute;left:1001px;top:55px;width:416px;height:87px;z-index:30}
  .selector .pill{left:0;top:0;width:416px}
  .arrow{position:absolute;top:20px;width:47px;height:47px;border-radius:50%;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;transition:background-color .2s ease,color .6s ease,transform .2s ease}
  @media (hover:hover){.arrow:hover{background:rgba(0,0,0,.07)}}
  .arrow:active{transform:scale(.92)}
  .arrow svg{width:23px;height:23px}
  .arrow-l{left:13px}.arrow-r{right:13px}
  .pick{position:absolute;left:62px;right:62px;top:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:15px;border:0;background:transparent;color:var(--ink);cursor:pointer;padding:0;transition:color .6s ease}
  .tile-ic{width:51px;height:51px;border-radius:15px;display:grid;place-items:center;flex:none;transition:background-color .5s ease,color .5s ease}
  .tile-ic svg{width:33px;height:33px;display:block}
  .pick .name{font-size:28.5px;font-weight:600;letter-spacing:-.005em;white-space:nowrap}
  .pick .chev{width:18px;height:12px;margin-left:-3px;flex:none;transition:transform .25s ease}
  .pick[aria-expanded="true"] .chev{transform:rotate(180deg)}

  .menu{position:absolute;left:0;top:102px;width:416px;padding:12px;border-radius:40px;background:var(--pill);color:var(--ink);box-shadow:0 26px 60px rgba(0,0,0,.28);opacity:0;transform:translateY(-10px) scale(.98);transform-origin:50% 0;pointer-events:none;transition:opacity .2s ease,transform .25s var(--ease),background-color .6s ease}
  .menu.open{opacity:1;transform:none;pointer-events:auto}
  .mi{display:flex;align-items:center;gap:18px;width:100%;height:76px;border:0;border-radius:30px;background:transparent;color:inherit;padding:0 16px;cursor:pointer;text-align:left;transition:background-color .15s ease}
  @media (hover:hover){.mi:hover{background:rgba(0,0,0,.06)}}
  .mi.active{background:rgba(0,0,0,.09)}
  .mi .tile-ic{width:48px;height:48px;border-radius:14px}
  .mi .tile-ic svg{width:31px;height:31px}
  .mi .nm{flex:1;font-size:26px;font-weight:600;white-space:nowrap}
  .mi .no{font-family:'Space Mono',monospace;font-size:17px;opacity:.5}

  .pill-gh{left:2110px;width:221px;display:flex;align-items:center;padding-left:17px;text-decoration:none;cursor:pointer;z-index:20}
  .pill-gh svg{width:44px;height:44px;color:var(--ghic);transition:color .6s ease}
  .pill-gh .name{margin-left:17px;font-size:27.5px;font-weight:600}

  /* ---------- floating project tiles ---------- */
  #tiles{position:absolute;left:0;top:0;width:0;height:0;z-index:2}
  .tile{position:absolute;left:0;top:0;width:258px;height:258px;transform-origin:50% 50%;cursor:pointer;outline:none;
    transition:transform .85s var(--ease),opacity .3s ease}
  .tile .face{position:absolute;inset:0;border-radius:24%;transition:transform .3s ease;overflow:visible}
  @media (hover:hover){.tile:hover .face{transform:scale(1.045)}}
  .tile:focus-visible .face{transform:scale(1.045)}
  .tile .g{position:absolute}
  .tile .g svg{width:100%;height:100%;display:block}
  .tlabel{position:absolute;left:0;top:0;font-size:28.5px;font-weight:600;letter-spacing:.005em;color:var(--label);white-space:nowrap;pointer-events:none;
    transition:transform .85s var(--ease),opacity .3s ease,color .6s ease}
  .no-anim .tile,.no-anim .tlabel{transition:none!important}

  /* ---------- tilted device ---------- */
  .device{left:635px;top:364px;width:1104px;height:616px;border-radius:78px;border:3px solid var(--devborder);overflow:hidden;z-index:5;
    transform:rotate(4.25deg) scale(var(--ds,1));transform-origin:50% 50%;
    background:#101f1a;
    box-shadow:0 50px 90px var(--devshadow);
    transition:border-color .6s ease,box-shadow .6s ease}
  .device.pop{animation:devpop .6s var(--ease)}
  @keyframes devpop{0%{transform:rotate(4.25deg) scale(calc(var(--ds,1) * .965))}100%{transform:rotate(4.25deg) scale(var(--ds,1))}}
  .scr{position:absolute;inset:0;opacity:0;transition:opacity .55s ease;pointer-events:none}
  .scr.on{opacity:1}
  .scr img{position:absolute;left:-46px;top:-6px;width:1200px;max-width:none;height:auto;display:block;-webkit-user-drag:none}
  .scr.ph{display:grid;place-items:center}
  .ph-in{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:-6px}
  .ph-ic{width:112px;height:112px;opacity:.9}
  .ph-ic svg{width:100%;height:100%;display:block}
  .ph-t{font-size:40px;font-weight:600;letter-spacing:-.02em}
  .ph-s{font-size:15px;opacity:.65}

  /* ---------- bottom card ---------- */
  .info{left:420px;top:1232px;width:1579px;height:211px;border-radius:60px;background:var(--pill);color:var(--ink);z-index:6;
    box-shadow:0 22px 48px var(--cardshadow);transition:background-color .6s ease,box-shadow .6s ease}
  .info .fade{transition:opacity .17s ease,transform .17s ease,color .6s ease,background-color .5s ease}
  .info .fade.out{opacity:0;transform:translateY(8px)}
  .info .ic{position:absolute;left:44px;top:40px;width:134px;height:134px;border-radius:30px;display:grid;place-items:center}
  .info .ic svg{width:76px;height:76px;display:block}
  .info h2{position:absolute;left:219px;top:53px;margin:0;font-size:45px;font-weight:600;letter-spacing:-.01em;line-height:1.1;color:var(--ink)}
  .info p{position:absolute;left:219px;top:120px;margin:0;font-size:24.5px;color:var(--sub);line-height:1.2;white-space:nowrap}
  .btn{position:absolute;top:60px;height:92px;border-radius:22px;display:flex;align-items:center;font-size:29px;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap;
    transition:transform .2s ease,box-shadow .2s ease,background-color .6s ease,color .6s ease,opacity .3s ease}
  @media (hover:hover){.btn:hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(15,44,31,.18)}}
  .btn.disabled{opacity:.4;pointer-events:none}
  .btn-dark{left:957px;width:274px;background:var(--btn);color:var(--btnt);padding-left:43px}
  .btn-dark svg{position:absolute;right:36px;top:34px;width:24px;height:24px}
  .btn-light{left:1255px;width:283px;background:#fffefb;border:2px solid #e3e1ce;color:var(--ink);padding-left:28px;font-size:27px}
  .btn-light svg{position:absolute;right:34px;top:23px;width:44px;height:44px;color:var(--ghic)}

  .counter{left:1140px;width:200px;top:1474px;text-align:center;font-size:21.5px;color:var(--counter);letter-spacing:.01em;line-height:30px;transition:color .6s ease,opacity .17s ease}
  .big-no{left:2220px;top:1152px;font-size:84px;font-weight:600;letter-spacing:-.03em;color:var(--bigno);line-height:1;transition:color .6s ease,opacity .17s ease,transform .17s ease}
  .big-no::before{content:attr(data-n)}
  .counter.out,.big-no.out{opacity:0}

  /* ---------- portrait / phone layout: the stage becomes 1080 wide ---------- */
  .portrait .ring-big{left:-130px;width:1340px;height:1200px;top:calc(var(--dcy) - 600px)}
  .portrait .ring-small{left:140px;width:800px;height:770px;top:calc(var(--dcy) - 385px)}
  .portrait .logo{left:48px;top:58px;font-size:62px}
  .portrait .pill-gh{left:800px;top:48px;width:232px;height:92px;border-radius:46px;padding-left:20px}

  const stage = document.getElementById('stage');

  function layout(){
    const de = document.documentElement;
    const vw = de.clientWidth || innerWidth, vh = de.clientHeight || innerHeight;
    PORTRAIT = vw < vh * 0.95;
    let W = 2419, H = 1512;
    if (PORTRAIT) { W = 1080; H = Math.max(1840, Math.round(vh * 1080 / vw)); }

    stage.classList.toggle('portrait', PORTRAIT);
    stage.style.width = W + 'px'; stage.style.height = H + 'px';
    stage.style.setProperty('--H', H + 'px');
    stage.style.setProperty('--dcy', (700 + DY) + 'px');
    stage.style.setProperty('--tcy', (1140 + TY) + 'px');
    const sc = Math.min(vw / W, vh / H);
    stage.style.transform = `translate(${(vw - W * sc) / 2}px, ${(vh - H * sc) / 2}px) scale(${sc})`;
  }

        devborder:'#e8e4dc', devshadow:'rgba(90,30,5,.42)', cardshadow:'rgba(110,40,10,.3)' } },

    { id:'color', no:'05', name:'Color Please', desc:'Generate color palettes and copy any color in one click.',
      shot:SHOTS.color, links:{ visit:'https://color-please.vercel.app/', repo:'https://github.com/aporka-droid/color-please' },
      mini:{ bg:'#f6a9c6', c:'#20211f', icon:'cmark', w:{ pill:7, menu:7, info:5 } },
      tile:{ bg:'#fbd9e6', html:`<div class="g" style="left:57px;top:57px;width:144px;height:144px;color:#20211f;transform:rotate(-4deg)"><div style="position:absolute;inset:0;border-radius:50%;background:#f6a9c6"></div><div style="position:absolute;inset:0">${ICONS.cmark(6)}</div></div>` },
      theme:{ bg:'#e8478f', ring1:'#ec5799', ring2:'#ef69a4', ink:'#20211f', pill:'#f8f4f1', logo:'#fff3f8', label:'#fff3f8',
        counter:'rgba(255,243,248,.78)', bigno:'rgba(255,243,248,.14)', btn:'#20211f', btnt:'#f8f4f1', sub:'#6b6a66', ghic:'#20211f',
        devborder:'#f6a9c6', devshadow:'rgba(110,10,55,.42)', cardshadow:'rgba(120,10,60,.3)' } }
  ];
  const N = PROJECTS.length;

  /* Left-to-right order of the carousel ring. Matches both of your designs:
     QR Please centred -> Project 03, Todo Please | Project 04, Project 05
     Todo Please centred -> Project 05, Project 03 | QR Please, Project 04 */
  const RING = [2, 1, 0, 3, 4];
  const slotOf = (idx, active) => [0, 1, 2, -2, -1][(RING.indexOf(idx) - RING.indexOf(active) + N) % N];

  /* tile + label poses for the four side slots (canvas px), plus per-design overrides */
  const BASE = {
    '-2': { x:65,   y:761, r:-13, s:252/258, lx:100,  ly:920, lr:-15 },
    '-1': { x:418,  y:670, r:-7,  s:1,       lx:432,  ly:838, lr:-7  },
    '1':  { x:2002, y:666, r:4,   s:262/258, lx:1986, ly:835, lr:4   },
    '2':  { x:2364, y:797, r:17,  s:252/258, lx:2318, ly:950, lr:18  }
  };
  const OVERRIDES = {
    todo: {
      '-1': { x:438,  y:683, r:-5, s:264/258, lx:453,  ly:849, lr:-5 },
      '2':  { x:2352, y:786, r:17, s:252/258, lx:2298, ly:938, lr:19 }
    }
  };
  const CENTER = { x:1187, y:672, r:0, s:.5, lx:1187, ly:672, lr:0 };
  /* portrait: the four neighbours sit in a row under the device card */
  const PBASE = {
    '-2': { x:128, y:1160, r:-10, s:.72, lx:128, ly:1298, lr:-10 },
    '-1': { x:355, y:1128, r:-5,  s:.72, lx:355, ly:1266, lr:-5  },
    '1':  { x:725, y:1128, r:4,   s:.72, lx:725, ly:1266, lr:4   },
    '2':  { x:952, y:1160, r:11,  s:.72, lx:952, ly:1298, lr:11  }
  };
  const PCENTER = { x:540, y:700, r:0, s:.45, lx:540, ly:700, lr:0 };
  const slotsFor = i => PORTRAIT ? PBASE : Object.assign({}, BASE, OVERRIDES[PROJECTS[i].id] || {});

  /* ---------- elements ---------- */
  const root = document.documentElement;
  const $ = id => document.getElementById(id);
  const el = { pickIc:$('pickIc'), pickName:$('pickName'), menu:$('menu'), pick:$('pick'),
    infoIc:$('infoIc'), infoName:$('infoName'), infoDesc:$('infoDesc'), visit:$('visit'), repo:$('repo'),
    counter:$('counter'), bigno:$('bigno'), device:$('device') };

  const iconHTML = (p, kind) => ICONS[p.mini.icon](p.mini.w[kind]);
  const miniStyle = p => { return { bg:p.mini.bg, c:p.mini.c }; };
  function paintMini(node, p, kind){ node.style.background = p.mini.bg; node.style.color = p.mini.c; node.innerHTML = iconHTML(p, kind); }

  /* tiles + labels */
  const tilesEl = $('tiles');
  const groups = PROJECTS.map((p, idx) => {
    const tile = document.createElement('div');
    tile.className = 'tile'; tile.tabIndex = 0; tile.setAttribute('role','button'); tile.setAttribute('aria-label', 'Show ' + p.name);
    tile.innerHTML = `<div class="face" style="background:${p.tile.bg}">${p.tile.html}</div>`;
    const label = document.createElement('div');
    label.className = 'tlabel'; label.textContent = p.name;
    tile.addEventListener('click', () => go(idx));
    tile.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(idx); } });
    tilesEl.append(tile, label);
    return { tile, label, timer:null };
  });

  /* screens inside the device */
  const screensEl = $('screens');
  const screens = PROJECTS.map(p => {
    const s = document.createElement('div'); s.className = 'scr';
    if (p.shot) {
      s.innerHTML = `<img src="${p.shot}" alt="${p.name} app screen" draggable="false">`;
    } else {
      s.classList.add('ph'); s.style.background = p.tile.bg;
      s.innerHTML = `<div class="ph-in" style="color:${p.theme.ink}"><div class="ph-ic" style="color:${p.mini.c}">${ICONS[p.mini.icon](p.mini.w.menu)}</div><div class="ph-t">${p.name}</div><div class="ph-s">Screen coming soon</div></div>`;
    }
    screensEl.append(s); return s;
  });

  /* dropdown */
  const menuItems = PROJECTS.map((p, i) => {
    const b = document.createElement('button');
    b.className = 'mi'; b.type = 'button'; b.setAttribute('role','option');
    b.innerHTML = `<span class="tile-ic"></span><span class="nm">${p.name}</span><span class="no">${p.no}</span>`;
    paintMini(b.querySelector('.tile-ic'), p, 'menu');
    b.addEventListener('click', () => { go(i); closeMenu(); });
    el.menu.append(b); return b;
  });
  function openMenu(){ el.menu.classList.add('open'); el.pick.setAttribute('aria-expanded','true'); }
  function closeMenu(){ el.menu.classList.remove('open'); el.pick.setAttribute('aria-expanded','false'); }
  el.pick.addEventListener('click', e => { e.stopPropagation(); el.menu.classList.contains('open') ? closeMenu() : openMenu(); });
  document.addEventListener('click', e => { if (!$('selector').contains(e.target)) closeMenu(); });

  /* ---------- poses ---------- */
  function pose(g, slot, set, withOpacity = true){
    const c = slot === 0 ? (PORTRAIT ? PCENTER : CENTER) : set[slot];
    const oy = PORTRAIT ? TY : 0;
    g.tile.style.transform  = `translate(${c.x - 129}px, ${c.y + oy - 129}px) rotate(${c.r}deg) scale(${c.s})`;
    g.label.style.transform = `translate(${c.lx}px, ${c.ly + oy}px) translate(-50%, -50%) rotate(${c.lr}deg)`;
    if (withOpacity) {
      const v = slot === 0 ? 0 : 1;
      g.tile.style.opacity = v; g.label.style.opacity = v;
      g.tile.style.pointerEvents = v ? 'auto' : 'none';
    }
  }
  const metaTheme = document.querySelector('meta[name=theme-color]');
  function applyTheme(t){ for (const k in t) root.style.setProperty('--' + k, t[k]); if (metaTheme && t.bg) metaTheme.content = t.bg; }

  function swapText(node, fn, delay = 170){ node.classList.add('out'); setTimeout(() => { fn(); node.classList.remove('out'); }, delay); }

  function paintInfo(p){
    paintMini(el.infoIc, p, 'info');
    el.infoName.textContent = p.name; el.infoDesc.textContent = p.desc;
    const live = !!p.links;
    el.visit.classList.toggle('disabled', !live); el.repo.classList.toggle('disabled', !live);
    if (live) {
      el.visit.href = p.links.visit; el.repo.href = p.links.repo;
      const real = p.links.visit && p.links.visit !== '#';
      if (real) { el.visit.target = '_blank'; el.visit.rel = 'noopener'; } else { el.visit.removeAttribute('target'); el.visit.removeAttribute('rel'); }
    }
  }

  /* long names shrink so the bar and its arrows keep your design's width */
  function fitName(){
    const n = el.pickName, pk = el.pick;
    n.style.fontSize = '';
    const base = parseFloat(getComputedStyle(n).fontSize) || 28.5;
    const cs = getComputedStyle(pk);
    const gap = parseFloat(cs.columnGap || cs.gap) || 15;
    const chev = pk.querySelector('.chev');
    const used = el.pickIc.offsetWidth + parseFloat(getComputedStyle(chev).width) + gap * 2 - 3 + 6;
    const avail = pk.clientWidth - used;
    const w = n.scrollWidth;
    if (w > avail) n.style.fontSize = Math.max(base * .66, base * avail / w) + 'px';
  }

  /* ---------- state ---------- */
  let active = 0;

  function go(next, first){
    if (next === active && !first) return;
    const prev = active; active = next;
    const p = PROJECTS[active], set = slotsFor(active);

    applyTheme(p.theme);
    document.title = 'please. — ' + p.name;
    try { history.replaceState(null, '', '#' + p.id); } catch(e){}

    groups.forEach((g, i) => {
      clearTimeout(g.timer);
      const o = slotOf(i, prev), n = slotOf(i, active);
      if (!first && Math.abs(n - o) > 2) {
        /* tile would cross the whole screen: fade out, jump to the far side, fade in */
        g.tile.style.opacity = 0; g.label.style.opacity = 0; g.tile.style.pointerEvents = 'none';
        g.timer = setTimeout(() => {
          [g.tile, g.label].forEach(e => e.style.transition = 'none');
          pose(g, n, set, false);
          void g.tile.offsetWidth;
          [g.tile, g.label].forEach(e => e.style.transition = '');
          const v = n === 0 ? 0 : 1;
          g.tile.style.opacity = v; g.label.style.opacity = v; g.tile.style.pointerEvents = v ? 'auto' : 'none';
        }, 300);
      } else {
        pose(g, n, set);
      }
    });

    screens.forEach((s, i) => s.classList.toggle('on', i === active));
    menuItems.forEach((b, i) => { b.classList.toggle('active', i === active); b.setAttribute('aria-selected', i === active); });

    if (first) {
      paintMini(el.pickIc, p, 'pill'); el.pickName.textContent = p.name; fitName(); paintInfo(p);
      el.counter.textContent = `${p.no} / 0${N}`; el.bigno.dataset.n = p.no;
    } else {
      swapText(el.pickName, () => { el.pickName.textContent = p.name; paintMini(el.pickIc, p, 'pill'); fitName(); });
      [el.infoIc, el.infoName, el.infoDesc].forEach(n => n.classList.add('out'));
      setTimeout(() => { paintInfo(p); [el.infoIc, el.infoName, el.infoDesc].forEach(n => n.classList.remove('out')); }, 170);
      swapText(el.counter, () => { el.counter.textContent = `${p.no} / 0${N}`; });
      swapText(el.bigno,   () => { el.bigno.dataset.n = p.no; });
      el.device.classList.remove('pop'); void el.device.offsetWidth; el.device.classList.add('pop');
    }
  }

  const step = dir => { const r = RING.indexOf(active); go(RING[(r + dir + N) % N]); };
  $('prev').addEventListener('click', () => step(-1));
  $('next').addEventListener('click', () => step(1));
  addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft')  { step(-1); }
    else if (e.key === 'ArrowRight') { step(1); }
    else if (e.key === 'Escape') { closeMenu(); }
  });

  /* swipe left/right anywhere to change project */
  let tx = 0, ty = 0, tt = 0;
  addEventListener('touchstart', e => { if (e.touches.length !== 1) return; tx = e.touches[0].clientX; ty = e.touches[0].clientY; tt = Date.now(); }, { passive:true });
  addEventListener('touchend', e => {
    const t = e.changedTouches[0]; if (!t || el.menu.classList.contains('open')) return;
    const dx = t.clientX - tx, dyy = t.clientY - ty;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dyy) * 1.5 && Date.now() - tt < 700) step(dx < 0 ? 1 : -1);
  }, { passive:true });

  /* resize / rotate: re-lay out without animating */
  let rz;
  addEventListener('resize', () => {
    layout(); stage.classList.add('no-anim');
    groups.forEach((g, i) => pose(g, slotOf(i, active), slotsFor(active)));
    fitName();
    clearTimeout(rz); rz = setTimeout(() => stage.classList.remove('no-anim'), 80);
  });

  /* ---------- start ---------- */
  const hashIdx = PROJECTS.findIndex(p => '#' + p.id === location.hash);
  stage.classList.add('no-anim');
  active = hashIdx >= 0 ? hashIdx : 0;
  applyTheme(PROJECTS[active].theme);
  groups.forEach((g, i) => pose(g, slotOf(i, active), slotsFor(active)));
  screens[active].classList.add('on');
  go(active, true);
  /* reveal only when fonts are in and everything is positioned, so nothing visibly shifts */
  const vp = document.getElementById('vp');
  const reveal = () => {
    fitName();
    requestAnimationFrame(() => {
      vp.classList.add('ready');
      requestAnimationFrame(() => { stage.classList.remove('no-anim'); root.classList.remove('boot'); });
    });
  };
  if (document.fonts && document.fonts.load) {
    const loads = Promise.all([
      document.fonts.load('600 28px "Hanken Grotesk"'),
      document.fonts.load('400 16px "Hanken Grotesk"'),
      document.fonts.load('400 16px "Space Mono"')
    ]);
    Promise.race([loads, new Promise(r => setTimeout(r, 1500))]).then(reveal, reveal);
  } else reveal();
})();
</script>
</body>
</html>
